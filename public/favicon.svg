<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="tl-favicon-title">
  <title id="tl-favicon-title">TradeLab Academy</title>
  <defs>
    <linearGradient id="tl-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171d27" />
      <stop offset="100%" stop-color="#0f131a" />
    </linearGradient>
    <linearGradient id="tl-rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#384459" />
      <stop offset="100%" stop-color="#202736" />
    </linearGradient>
    <linearGradient id="tl-ink" x1="0" y1="17" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f1f4f9" />
      <stop offset="100%" stop-color="#dfe4ec" />
    </linearGradient>
    <linearGradient id="tl-bull" x1="0" y1="13" x2="0" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b096" />
      <stop offset="100%" stop-color="#089981" />
    </linearGradient>
    <linearGradient id="tl-blue" x1="36.5" y1="42.5" x2="51.5" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4b7dff" />
      <stop offset="100%" stop-color="#2962ff" />
    </linearGradient>
  </defs>

  <!-- Obsidian squircle container & machined bezel hairline -->
  <rect width="64" height="64" rx="14" fill="url(#tl-bg)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#tl-rim)" stroke-width="1.5" />

  <!-- Platinum "T" structural monogram -->
  <rect x="12.5" y="17" width="20.5" height="5.5" rx="1.2" fill="url(#tl-ink)" />
  <rect x="20" y="17" width="5.5" height="31" rx="1.2" fill="url(#tl-ink)" />

  <!-- Ascending Bull Emerald Candle ("L" vertical column) -->
  <rect x="38.75" y="13" width="2.5" height="8.5" rx="1" fill="url(#tl-bull)" />
  <rect x="36.5" y="19.5" width="7" height="20.5" rx="1.2" fill="url(#tl-bull)" />

  <!-- Signal Blue "L" baseline / order-block shelf -->
  <rect x="36.5" y="42.5" width="15" height="5.5" rx="1.2" fill="url(#tl-blue)" />
</svg>
