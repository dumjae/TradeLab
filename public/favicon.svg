<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#0f131a" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#262e3d" stroke-width="2" />
  <!-- TradingView-style reference level -->
  <line x1="11" y1="22" x2="53" y2="22" stroke="#2962ff" stroke-opacity="0.85" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round" />
  <!-- Left bearish candle -->
  <line x1="22" y1="15" x2="22" y2="49" stroke="#f23645" stroke-width="2.6" stroke-linecap="round" />
  <rect x="16" y="25" width="12" height="15" rx="2.5" fill="#f23645" />
  <!-- Right bullish breakout candle -->
  <line x1="42" y1="12" x2="42" y2="51" stroke="#089981" stroke-width="2.8" stroke-linecap="round" />
  <rect x="36" y="18" width="12" height="24" rx="2.5" fill="#089981" />
  <!-- Signature blue accent dot -->
  <circle cx="51" cy="14" r="3" fill="#2962ff" />
</svg>
